<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snap Vanish</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon-48.png" alt="" width="28" height="28">
      <div>
        <h1>Snap Vanish</h1>
        <p class="tag">Snap to turn to dust</p>
      </div>
    </div>
    <label class="switch" title="Turn Snap Vanish on or off">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="status" id="status">
    <span class="dot"></span>
    <span id="statusText">Checking this tab…</span>
  </section>

  <section class="card room">
    <div class="row"><span class="label">Empty room</span><span class="badge" id="roomMode"></span></div>
    <div class="room-photo" id="roomPhotoRow" hidden>
      <img id="roomThumb" alt="Your saved empty room">
      <div class="room-side">
        <button id="retakePhoto" class="ghost">Retake</button>
        <button id="clearPhoto" class="link">Remove</button>
      </div>
    </div>
    <button id="takePhoto" class="capture" disabled>Capture empty room</button>
    <p class="note" id="roomNote"></p>
  </section>

  <button id="snapNow" class="snap" disabled>
    <span class="snap-icon">✦</span>
    <span id="snapLabel">Snap now</span>
  </button>
  <div class="check-line" id="snapCheck" hidden>
    <span id="handCheck" class="pill">Hand</span>
    <span id="soundCheck" class="pill">Sound</span>
  </div>
  <p class="shortcut">Shortcut: <kbd id="shortcut">not set</kbd> · <a href="#" id="editShortcut">change</a></p>

  <section class="card">
    <div class="row">
      <label for="sensitivity">Snap sensitivity</label>
      <output id="sensitivityOut"></output>
    </div>
    <input type="range" id="sensitivity" min="1" max="10" step="1">
    <div class="hint"><span>Strict</span><span>Loose</span></div>

    <div class="row">
      <label for="dustSeconds">Dust duration</label>
      <output id="dustSecondsOut"></output>
    </div>
    <input type="range" id="dustSeconds" min="1" max="6" step="0.5">

    <div class="row"><span class="label">Dust direction</span></div>
    <div class="segmented" id="direction" role="radiogroup">
      <button data-dir="left" role="radio" title="Blow left">←</button>
      <button data-dir="up" role="radio" title="Blow up">↑</button>
      <button data-dir="right" role="radio" title="Blow right">→</button>
      <button data-dir="random" role="radio" title="Random wind">≋</button>
    </div>
  </section>

  <section class="card toggles">
    <label class="check">
      <input type="checkbox" id="confirmWithSound">
      <span>Confirm with snap sound<small>Listens for the snap while your hand is in snap position</small></span>
    </label>
    <label class="check">
      <input type="checkbox" id="muteMic">
      <span>Mute mic while vanished</span>
    </label>
  </section>

  <footer>🔒 Runs fully on this computer. No video leaves your browser.</footer>
  <script src="popup.js"></script>
</body>
</html>
